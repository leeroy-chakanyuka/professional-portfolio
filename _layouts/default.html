<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2736">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | default: site.title | escape }} | Leeroy Chakanyuka</title>
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="wordmark" href="{{ '/' | relative_url }}">LC<span class="wordmark-dot">.</span><span class="wordmark-name"> Leeroy Chakanyuka</span></a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Portfolio</a>
        <a href="{{ '/agile/' | relative_url }}">Agile evidence</a>
        <a href="https://github.com/leeroy-chakanyuka/professional-portfolio">Source</a>
      </nav>
    </div>
  </header>
  <div class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Professional portfolio · 2026</p>
      <h1>{{ page.title | default: site.title | escape }}</h1>
      <p class="hero-description">{{ page.description | default: site.description | escape }}</p>
    </div>
  </div>
  <main id="main" class="content-shell">
    {{ content }}
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <span>Leeroy Chakanyuka · CPUT ICT Applications Development</span>
      <a href="{{ '/' | relative_url }}">Return to portfolio</a>
    </div>
  </footer>
</body>
</html>
